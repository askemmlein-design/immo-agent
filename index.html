<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoAgent</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:30px}
.container{max-width:850px;margin:auto}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
input,select,button{width:100%;padding:12px;margin:8px 0 16px;border-radius:8px;border:1px solid #ddd}
button{background:#0057ff;color:white;border:none;font-size:16px;cursor:pointer}
.legend,.result{background:#eef2f7;padding:16px;border-radius:12px;margin-top:20px}
.result.green{border-left:8px solid #22c55e}
.result.yellow{border-left:8px solid #facc15}
.result.red{border-left:8px solid #ef4444}
.why{background:white;padding:14px;border-radius:10px;margin-top:14px}
</style>
</head>
<body>

<div class="container">
<div class="card">

<h1>🏡 ImmoAgent Alpha</h1>
<p>Immobilien bewerten statt nur suchen.</p>

<label>Objektart</label>
<select id="type">
<option>Wohnung Kauf</option>
<option>Wohnung Miete</option>
<option>Haus Kauf</option>
<option>Haus Miete</option>
</select>

<label>Maximalpreis (€)</label>
<input id="price" type="number" value="200000">

<label>Suchradius (km)</label>
<input id="radius" type="number" value="25">

<label>Wohnfläche (m²)</label>
<input id="size" type="number" value="50">

<label>Baujahr</label>
<input id="year" type="number" value="2000">

<label>Energieklasse</label>
<select id="energy">
<option>A+</option><option>A</option><option>B</option><option>C</option>
<option>D</option><option>E</option><option>F</option>
</select>

<label>Hausgeld (€)</label>
<input id="fee" type="number" value="280">

<button onclick="bewerten()">Bewerten</button>

<div class="legend">
<b>Bewertungslogik</b><br><br>
🟢 80–100 Punkte = Interessant<br>
🟡 60–79 Punkte = Prüfen<br>
🔴 0–59 Punkte = Eher nicht<br><br>
L = Lage | P = Preis | Z = Zustand | E = Energie | H = Hausgeld | D = Dokumentation | R = Rücklagen
</div>

<div id="result"></div>

</div>
</div>

<script>
function bewerten(){
let price = Number(document.getElementById("price").value);
let size = Number(document.getElementById("size").value);
let year = Number(document.getElementById("year").value);
let energy = document.getElementById("energy").value;
let fee = Number(document.getElementById("fee").value);

let sqmPrice = price / size;

let lage = 18;
let preis = sqmPrice <= 4500 ? 20 : sqmPrice <= 6500 ? 15 : 8;
let zustand = year >= 2010 ? 15 : year >= 1990 ? 11 : 7;

let energieMap = {"A+":15,"A":14,"B":12,"C":10,"D":7,"E":4,"F":2};
let energie = energieMap[energy];

let hausgeld = fee <= 250 ? 10 : fee <= 400 ? 7 : 3;
let dokumentation = 8;
let ruecklagen = 7;

let total = lage + preis + zustand + energie + hausgeld + dokumentation + ruecklagen;

let color = total >= 80 ? "green" : total >= 60 ? "yellow" : "red";
let ampel = total >= 80 ? "🟢 Interessant" : total >= 60 ? "🟡 Prüfen" : "🔴 Eher nicht";

document.getElementById("result").innerHTML = `
<div class="result ${color}">
<h2>Bewertungsergebnis</h2>
<h3>${total}/100 Punkte</h3>
<p><b>${ampel}</b></p>
<hr>
<b>Punkteübersicht</b>
<ul>
<li>Lage: ${lage}/20</li>
<li>Preis: ${preis}/20 (${Math.round(sqmPrice)} €/m²)</li>
<li>Zustand: ${zustand}/15</li>
<li>Energie: ${energie}/15</li>
<li>Hausgeld: ${hausgeld}/10</li>
<li>Dokumentation: ${dokumentation}/10</li>
<li>Rücklagen: ${ruecklagen}/10</li>
</ul>

<div class="why">
<b>Warum?</b>
<ul>
<li>Preis pro m² wurde automatisch berechnet</li>
<li>Baujahr beeinflusst die Zustandsbewertung</li>
<li>Energieklasse beeinflusst die Energiebewertung</li>
<li>Hausgeld wird nach Höhe bewertet</li>
<li>Lage, Dokumentation und Rücklagen sind aktuell noch Basiswerte</li>
</ul>
</div>
</div>`;
}
</script>

</body>
</html>
