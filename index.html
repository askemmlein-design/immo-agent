<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoAgent</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:40px}
.container{max-width:850px;margin:auto}
.card{background:white;border-radius:16px;padding:28px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
input,select,button{width:100%;padding:13px;margin-top:8px;margin-bottom:18px;border-radius:9px;border:1px solid #ddd}
button{background:#2563eb;color:white;font-size:16px;border:none;cursor:pointer}
.result{margin-top:18px;padding:18px;border-radius:12px;background:#eef6ff}
.green{border-left:8px solid #22c55e}
.yellow{border-left:8px solid #facc15}
.red{border-left:8px solid #ef4444}
.legend{font-weight:bold}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🏡 ImmoAgent Alpha</h1>
<p>Immobilien bewerten statt nur suchen.</p>

<label>Objektart</label>
<select id="type">
<option>Wohnung Kauf</option>
<option>Wohnung Miete</option>
<option>Haus Kauf</option>
<option>Haus Miete</option>
<option>Garage Kauf</option>
<option>Garage Miete</option>
</select>

<label>Maximalpreis (€)</label>
<input id="price" type="number" placeholder="200000">

<label>Suchradius (km)</label>
<input id="radius" type="number" placeholder="25">

<button onclick="startSearch()">Suche starten</button>

<div id="results"></div>
</div>
</div>

<script>
function startSearch(){
const results=document.getElementById("results");
results.innerHTML=`
<div class="result green">
<h3>Wohnung München-Schwabing</h3>
<p><strong>Bewertung:</strong> 8/10 🟢</p>
<p class="legend">L+ | P+ | Z+ | E+ | H-</p>
<p>Interessant – Besichtigung empfohlen</p>
<p class="small">Gute Lage, attraktiver Preis, guter Zustand. Hausgeld prüfen.</p>
</div>

<div class="result yellow">
<h3>Wohnung München-Ost</h3>
<p><strong>Bewertung:</strong> 6/10 🟡</p>
<p class="legend">L+ | P- | Z- | D-</p>
<p>Prüfen – Unterlagen und Zustand genauer ansehen</p>
<p class="small">Lage gut, aber Preis hoch und Exposé unvollständig.</p>
</div>

<div class="result red">
<h3>Wohnung München-Randlage</h3>
<p><strong>Bewertung:</strong> 3/10 🔴</p>
<p class="legend">L- | P- | Z- | E-</p>
<p>Eher nicht – nur bei besonderem Interesse prüfen</p>
<p class="small">Schwächere Lage, hoher Preis, Sanierungsbedarf und schlechte Energieangaben.</p>
</div>
`;
}
</script>
</body>
</html>
